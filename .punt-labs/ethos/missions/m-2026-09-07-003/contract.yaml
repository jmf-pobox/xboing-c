context: |
    Housekeeping created by the fix in PR #222, and it must not be left —
    a file violating a budget stated in a sibling rules file is exactly the
    class of self-contradiction that PR exists to remove.

    WHAT HAPPENED. .claude/rules/delegation.md is now 80 lines.
    .claude/rules/claude-md.md's Line Budget table says
    "Each .claude/rules/ file | < 80 lines". So it is over by one.

    WHY IT GREW, which is the justification for moving the number rather
    than trimming the file. Three claims in delegation.md were false and got
    corrected in PR #222:
      - "jck is read-only (Read/Grep/Glob/WebFetch)" — the role grants
        Read/Write/Edit/Grep/Glob/WebFetch
      - the test archetype documented as constraining to tests/** — it is
        Go-only, and refuses this repo's C test paths
      - a claim that jck's constraint is "enforced by archetype", which no
        code enforces

    Each correction is longer than the false statement it replaced, because
    accurate statements carry qualifiers and false ones do not. The 80-line
    ceiling was set when the file was shorter and wrong.

    A fourth attempt to fit under 80 was made by rewording an unrelated
    governance paragraph, and it introduced a NEW cross-file contradiction
    (dropping "solo", which CLAUDE.md:51 and docs/WORKFLOW.md:45 both
    retain). That was reverted. The lesson is recorded here deliberately:
    the budget must not be defended by shaving governance text.

    WHAT TO CHANGE. Raise the .claude/rules/ row to a number with headroom —
    100 is a sensible round figure — and add a short parenthetical or
    footnote saying the budget exists for adherence, not tidiness, and
    should not be met by trimming accuracy from a rule.

    DO NOT touch the root CLAUDE.md < 200 row. That number has an external
    rationale stated right there ("Anthropic's recommendation. Longer files
    degrade adherence across ALL instructions uniformly") and is not ours to
    move for convenience.

    DO NOT touch the sub-directory CLAUDE.md or @-imported docs rows.

    Keep it small. This is a number and a clause, not a rewrite of the
    guidance.
