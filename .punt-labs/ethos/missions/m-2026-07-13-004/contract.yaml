context: |
    PR #180 review (Copilot, src/game_callbacks.c:1151). editor_cb_on_playtest_end calls savegame_system_restore to round-trip the in-memory play-test board snapshot, but that helper unconditionally sets ctx->savegame_restored_session=true (savegame_system.c:311) — the anti-cheat marker that makes a session ineligible for GLOBAL high-score submission (read at game_modes.c:1016 and :1158). A play-test snapshot is NOT a loaded save, so setting that flag is inaccurate. Today it is self-corrected (start_new_game resets it at game_modes.c:107 before any score check), so there is no reachable impact — but leaving an inaccurate anti-cheat flag set is a latent trap. Fix at the call site (don't touch savegame_system_restore, which is correct for real save-loads). Part of fix/playtest-fidelity.
