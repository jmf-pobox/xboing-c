        delegation.md under 80 lines, I recovered exactly one line from the
        unrelated "Leader ≠ worker for code" paragraph by rewording two
        clauses without changing their meaning ("never the leader — the
        leader does not write production code solo" -> "never the leader,
        who never writes production code"; "is a rule you uphold, not a
        store refusal — so do not rationalize around it" -> "is upheld by
        you, not the store — do not rationalize around it"). Net effect:
        file stays at 79 lines (was 79, still 79), no new line exceeds 78
        chars (verified with awk; only the four pre-existing long lines —
        the frontmatter note and three Expert Agents table rows — remain
        over budget).

        FIX 2 (Bugbot, Medium): latex-tech-architect.yaml had no
        `personality:` key, the only identity missing one (verified against
        gjm, jdc, sjl, jck, claude). The generated agent's frontmatter
        `description` comes from the personality's opening paragraph, not
        the talent — confirmed by diffing .claude/agents/gjm.md's
        description against .punt-labs/ethos/personalities/myers.md's
        opening paragraph (identical text). Without a personality, the next
        SessionStart regeneration would produce
        .claude/agents/latex-tech-architect.md with no description, making
        the agent unselectable even though it still exists.

        Created .punt-labs/ethos/personalities/latex-architect.md with the
        agent's current description as its opening paragraph verbatim (the
        exact text that must survive as the generated frontmatter
        description), a Core Principles section drawn verbatim from the
        existing agent body's Core Principles (not invented), an Identity
        paragraph condensing the agent's "two disciplines" framing, and a
        Temperament section matching the shape of myers.md/carmack.md.
        Deliberately omitted LaTeX Technique, Document Structure Template,
        Workflow, Output Format, and Anti-Patterns sections — that
        technique/structure material already lives verbatim in the
        latex-technical-writing talent written last round, and duplicating
        it a third time (agent body -> talent -> personality) would be the
        same over-claiming defect this mission exists to fix, one layer
        down. Added `personality: latex-architect` to the identity YAML.
        Did not touch .claude/agents/latex-tech-architect.md and did not run
        `ethos enable` or force regeneration.

        Verification: `ethos doctor` (ETHOS_REPO_ROOT pinned to the
        worktree) reports 12/12 PASS; `make lint` reports 0 errors across
