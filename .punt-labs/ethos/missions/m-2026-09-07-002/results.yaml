        seeded archetype accepts docs/**, *.md write-sets; what is actually
        refused is a write_set naming this repo's C tests at
        `tests/test_*.c`. Narrowed the line to:

          `test` (2, Go-only; refused for `tests/test_*.c` write-sets; ethos-9yfp)

