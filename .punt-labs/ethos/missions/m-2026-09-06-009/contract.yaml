context: |
    Jim ran `ethos enable`, which installed the commit-msg trailer hook that
    bead xboing-yeuw part 3 was about. Doctor now reports the trailer and
    seal sections active and current.

    This mission exists partly to commit that output and partly as the TEST
    VEHICLE for part 2. The hook resolves the active mission through
    `ethos hook commit-trailers`, which reads only the committing session's
    active-mission sidecar. All eight missions today emitted
    "no session in context -- active-mission sidecar not updated" on create,
    and the sidecar was measured absent: 133 session dirs, exactly one
    active-mission file, stale from Sept 2.

    So the question this mission answers is: with the hook now installed and
    a mission genuinely open, does a real commit carry a Mission: trailer?

    If it does, part 2 was a red herring or has resolved, and xboing-yeuw
    closes. If it does not, the hook is installed and inert — which is
    precisely the failure class this whole session has been cataloguing, and
    the bead stays open with that recorded.

    Report the actual result. Do not adjust anything to make the trailer
    appear.
