      prose: |
        Pinned the Makefile lint target's npx fallback to
        markdownlint-cli2@0.17.2, matching what docs.yml's
        DavidAnson/markdownlint-cli2-action@05f32210e8... (v19.1.0) actually
        bundles. Added a short comment at the pin naming the action version
        it tracks, so a future action bump carries the pin forward instead of
        rotting silently. docs/BUILDING.md's install row now recommends the
        same pinned version instead of latest. The command -v guard is
        untouched in shape -- a developer's own installed binary still wins
        over npx.

        Verified by running make lint end-to-end (not by reasoning about
        version numbers): the version banner printed
        "markdownlint-cli2 v0.17.2 (markdownlint v0.37.4)", linted 103
        files, reported 0 errors, and the make target exited 0. 0.17.2 is
        older than the 0.23.2 that unpinned npx had been fetching throughout
        this PR, and it still passes clean on our current markdown corpus --
        no rule-default regressions surfaced.

        Explicit limitation, not glossed over: this only pins the "no local
        binary" path. A developer with markdownlint-cli2 installed globally
        at some other version still takes the command -v branch and is not
        pinned by this Makefile change -- that was an explicit constraint in
        the mission (do not change the guard's shape). No changes were made
        to .markdownlint-cli2.jsonc.
