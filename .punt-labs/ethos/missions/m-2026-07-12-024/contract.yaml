context: |
    Bring the editor play-test mode to parity with the 1996 original — three user-reported deviations (dogfooding 1.0.5), all in the same subsystem: xboing-hay (lives deplete during play-test; game-over fires on depletion; editor cursor not restored on return), xboing-nl4 (mode_edit_enter reset zeroes the modified flag on return from play-test -> unsaved-work confirm under-fires), xboing-bsz (board edits not preserved across play-test round-trip). Modern play-test = SDL2ST_GAME entered from SDL2ST_EDIT (mode_game_enter checks prev==SDL2ST_EDIT ~game_modes.c:222); return goes back to SDL2ST_EDIT via mode_edit_enter. The original: SetupPlayTest/FinishPlayTest (original/editor.c:587-641) save the board to a temp file and reload it around play; DecExtraLife (original/level.c:346-357) is a no-op in MODE_EDIT so lives never deplete; ball-death game-over is likewise gated. Modern game_rules.c:290 does ctx->lives_left-- with NO play-test guard, and the game-over path (game_rules.c ~290-300) fires at 0. This is a design blueprint only — NO production code. jck must approve the faithfulness of the play-test-detection mechanism and the infinite-lives / no-game-over / board-round-trip behavior (gameplay-affecting).
