context: |
    Copilot found this on PR #217 and is right. It is the fourth false claim
    caught in this file's comment, and the first one that is also a genuine
    behavioural gap rather than only wording.

    THE FINDING. The ignore list contains original/**, justified in the
    comment as "the verbatim 1996 source, not ours to reformat". But:

      git ls-files original/ | grep '\.md$'   ->  original/CLAUDE.md   (only one)
      git log --diff-filter=A -- original/CLAUDE.md
          ->  548d56b docs: extract TESTING.md and BUILDING.md from CLAUDE.md (#126)

    original/CLAUDE.md is OURS. We wrote it. It opens "Reading the Original
    XBoing Source (1996)" and is modern guidance prose about how to read that
    directory — it is not 1996 source. The actual 1996 source is .c/.h, which
    markdownlint never looks at.

    So original/** in a MARKDOWN lint ignore list does exactly one thing:
    it silently excludes a maintained document of ours from the gate. The
    rationale in the comment is not merely imprecise, it is inverted — the
    one file the pattern actually affects is the one file in there that IS
    ours to maintain.

    I verified the fix is clean before assigning it: I copied
    original/CLAUDE.md to a non-ignored path and ran make lint. Result was
    103 files, 0 issues, exit 0. It passes today, so removing the ignore
    costs nothing and closes the gap.

    THE FIX. Delete the "original/**" line from the ignores array. Then
    rewrite reason (a) so it covers .beads/ alone — .beads/ genuinely is
    tool-generated by bd and genuinely does have 4 pre-existing MD032
    violations, so it stays. Remove the now-false original/ clause and the
    "273 tracked files" figure along with it.

    Reason (b) is unaffected — those ten paths were each confirmed gitignored
    with git check-ignore and none of them is original/.

    KEEP the .punt-labs/ethos/** guardrail note verbatim in substance.

    WHY THIS KEEPS HAPPENING, and what I want from you this round. Three
    false claims have now shipped in this one comment across two rounds:
    "mirrors .gitignore" (wrong), ".beads is gitignored" (wrong), "original/
    is 1996 source not ours" (wrong). Each was written confidently and each
    was checkable in one command. The code in this PR was verified across
    four execution paths; the prose was not verified at all until reviewers
    pushed back. So: before you write a single word of the new comment, run
    the command that would falsify it. Then paste those commands and their
    output in your result. Claims first, prose second.
