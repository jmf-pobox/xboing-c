context: |
    PR #181 review (Copilot, src/game_modes.c:1374). The oyt fix used score_system_set_display(ctx->score, 0) in mode_edit_enter to clear the attract flourish. But set_display is documented "attract-mode animation only" and intentionally SKIPS extra-life threshold tracking (score_system.c check_extra_life / life_threshold). Using it for a real RESET leaves life_threshold stale. The correct reset is score_system_set(ctx->score, 0), which resets both the score AND the extra-life threshold (score_system.c:105 "Reset extra life tracking to current threshold"), keeping the system internally consistent — and it's the true modern equivalent of the original's SetTheScore(0L) (original/editor.c:603,629, main.c:944). set(0) awards no extra life (0 is below threshold), so no unwanted callback.
