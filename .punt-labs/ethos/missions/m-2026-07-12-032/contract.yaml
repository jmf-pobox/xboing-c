context: |
    Bug xboing-1ir FIXED (m-2026-07-12-031): sdl2_input_consume clears an action's just_pressed after it ends play-test, so the SAME frame's mode_edit_update doesn't re-process it (p was restarting play-test; Escape was going to attract). The prior xboing-lpi test (test_playtest_p_ends_via_live_game_input) MISSED this because it called only game_input_global and asserted SDL2ST_EDIT — it never ran the FOLLOWING editor tick (sdl2_state_update/mode_edit_update) that re-fires the still-pressed key. This mission adds the FULL-FRAME regression that drives game_input_global THEN the editor tick within one frame (no begin_frame between, so just_pressed persists) and asserts play-test stays ended. Using implement archetype for tests (xboing-dlg).
