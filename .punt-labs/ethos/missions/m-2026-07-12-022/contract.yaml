context: |
    PR #178 review (Cursor + Copilot, both on src/game_render.c:686): removing the ammo-belt cap (faithful belt fix) exposed a DoS. savegame validation accepts num_bullets up to SAVEGAME_MAX_BULLETS=9999 (src/savegame_system.c:88), and savegame_system_restore passes it straight to gun_system_set_ammo (savegame_system.c:338), which currently does ctx->ammo = count with NO clamp. game_render_ammo_belt then loops for(i<count) SDL_RenderCopy -> thousands of draws/frame on a crafted save; the bonus (reads gun_system_get_ammo) would also award a 9999-bullet bonus. Root fix: clamp gun ammo at the single choke point. Legit ammo range is [0, GUN_MAX_AMMO+1] (21 = the unlimited sentinel; add_ammo clamps at 20, the only >20 legit value is the 21 sentinel from MAXAMMO). Clamping there keeps the belt faithful (draws <= 21, the original's real max) and protects every consumer without touching save validation.
