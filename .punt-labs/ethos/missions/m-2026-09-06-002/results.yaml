      prose: |
        Fix: release.yml provenance job now references
        generator_generic_slsa3.yml@v2.1.0 (tag), not the commit SHA
        f7dd8c54c2067bafc12ca7a55595d5ee9b75204a. That SHA is removed from the
        file entirely.

        Inline comment added directly above the provenance job explaining: (1)
        slsa-github-generator's README requirement, in bold, that reusable
        builder/generator workflows MUST be referenced by tag; (2)
        builder-fetch.sh's mechanical enforcement (exit 2 if the ref isn't
        refs/tags/..., exit 7 if the tag isn't semver); (3) the silent-failure
        consequence of SHA-pinning here — the job runs to completion but
        produces no .intoto.jsonl; (4) the compensating control — builder-
        fetch.sh downloads the builder binary and verifies ITS SLSA provenance
        via slsa-verifier, cross-checked against the tag's resolved commit, so
        integrity comes from the verifier rather than ref immutability. Framed
        as not-a-bare-downgrade but explicitly not equivalent to a SHA pin
        either (tags are mutable in principle).

        docs/CI.md §9: removed the generator from the flat SHA-pinned list and
        added a "Deliberate exception" paragraph with the same four points, so
        a future SHA-pinning sweep reads the rationale before "fixing" this
        back to a SHA and reintroducing the silent attestation loss.

        docs/CI.md §10: the old bullet asserted, as a static-verification
        fact, that "the pin f7dd8c54c2067bafc12ca7a55595d5ee9b75204a was
        confirmed to resolve to v2.1.0" — no longer true, since the workflow
        doesn't reference that SHA anymore. Replaced with a true and more
        useful fact: a SHA pin was tried here and is affirmatively wrong
        (builds, but produces no attestation); it was replaced by the tag ref
        the generator requires. Kept the still-accurate permissions-
        verification sentence unchanged.

        Verification:
