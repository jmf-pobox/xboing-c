          changed, 23 and 41 lines respectively.
        - YAML parses (python3 yaml.safe_load).
        - grep -n "uses:" release.yml shows exactly one changed ref (provenance,
          now @v2.1.0); actions/checkout (both call sites), upload-artifact,
          and download-artifact remain SHA-pinned and byte-identical. The
          Homebrew installer pin (a curl URL, not a uses: line) was checked
          separately and is unchanged (7a133dcc74051ee4efc79467ed215dfedf45aea2
          at both call sites).
        - markdownlint: `make lint` exits 127 on this machine (markdownlint-cli2
