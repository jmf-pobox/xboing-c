context: |
    Final documentation item on PR #215. Both Copilot and Cursor Bugbot
    independently raised the same observation about the restored provenance
    job, and neither treated it as blocking — Cursor filed it as "Residual
    risk (not a finding)", Copilot as a suppressed "previously missed" note.

    THE PROPERTY. release.yml's `publish` job creates and publishes the
    GitHub Release BEFORE `provenance` runs. That ordering is forced: the
    generator's `upload-assets: true` needs the Release to exist before it
    can attach the .intoto.jsonl. So if the provenance job fails, the
    workflow goes red but a public Release already exists, carrying the
    .deb with no attestation.

    WHY WE ARE DOCUMENTING RATHER THAN FIXING IT HERE. Be precise about
    this, because the distinction is the whole point:
      - The bug this PR fixes (SHA-pinned generator ref) failed SILENTLY.
        Workflow GREEN, no attestation, nobody notices. That is why it
        survived from PR #209.
      - This ordering issue fails LOUDLY. Workflow RED. A maintainer sees
        it and investigates.
    A loud failure plus §10's existing next-release check is an acceptable
    interim posture. The real fix (draft Release → attach attestation →
    publish) touches smoke-deb and smoke-brew, which download assets from
    the Release, and cannot be rehearsed without a real tag push. It needs
    its own PR and its own rehearsal. It is filed as bead xboing-gqhx.

    This is NOT a "pre-existing issue, out of scope" dodge. The fix is
    filed, scoped, and its dependency on this PR is recorded. What must not
    happen is that the property goes unwritten — an undocumented known gap
    in a provenance path is exactly the failure this PR exists to correct.

    WHERE IT GOES. Extend the existing SLSA provenance bullet in §10's
    "Other gates in `release.yml`" list — the one you wrote in
    m-2026-09-06-001 round 2. Do not create a new section. Keep the same
    terse, factual voice as its neighbours. Do not restate the whole
    provenance design; add the ordering caveat and the pointer to the bead.

    Do not touch release.yml. No code change is wanted here.
