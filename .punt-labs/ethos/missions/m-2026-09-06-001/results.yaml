      prose: "# Mission m-2026-09-06-001 result — restore SLSA provenance job\n\n## Summary\n\nRestored the SLSA L3 provenance job to `.github/workflows/release.yml`\nby applying exactly the three hunks that `git diff 87eaf5b master --\n.github/workflows/release.yml` shows as *removed* (i.e. inverting that\ndiff), and nothing else. Both protected blocks that master gained after\nthe source commit — the Linuxbrew installer SHA-pin + `set -o pipefail`\n(#213) and the strict `deb_name` UPSTREAM-REVISION regex guard (#208) —\nare untouched. `docs/CI.md` required no edit: it already documents the\njob correctly (SHA pin, permissions) and needed the code to catch up,\nnot the other way round.\n\n## Changes made to `.github/workflows/release.yml`\n\n1. Header comment (lines ~7-11): replaced the \"NOT (yet) included: SLSA\n   L1 ... deferred\" text with the \"SLSA L3 provenance ... generated by\n   the provenance job below\" description.\n2. `build` job `outputs:`: added `subjects_b64` output wired to\n   `steps.provenance-subjects.outputs.subjects_b64`.\n3. Added the `Compute .deb sha256 subject for SLSA provenance` step\n   (`id: provenance-subjects`) immediately after `Build .deb via\n   dpkg-buildpackage` and before `Stage .deb + release notes for\n   upload`.\n4. Added the `provenance` job (needs `[build, publish]`, permissions\n   `actions: read` / `id-token: write` / `contents: write`, `uses:\n   slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a`\n   `# v2.1.0`, `with: base64-subjects: needs.build.outputs.subjects_b64,\n   upload-assets: true`) as section 3, with its full explanatory\n   comment block. Also appended one new sentence to that comment block\n   (not present in the original PR #209 text, added per the mission's\n   explicit instruction): a note that `.claude/rules/ci.md`'s \"every CI\n   gate needs a local make target\" rule does not apply here by\n   construction, since the attestation needs GitHub's Sigstore OIDC\n   token and an ephemeral hosted runner identity that has no local\n   equivalent.\n5. Renumbered section comments: build=1, publish=2, provenance=3,\n   smoke-deb=4 (was 3), smoke-brew=5 (was 4).\n6. Deleted the trailing \"SLSA L1 provenance attestation ... follow-up\n   under xboing-qlw7\" deferral comment block at the end of the file.\n\n## Full diff against master\n\n```diff\ndiff --git a/.github/workflows/release.yml b/.github/workflows/release.yml\nindex f0ab8d0..03915eb 100644\n--- a/.github/workflows/release.yml\n+++ b/.github/workflows/release.yml\n@@ -4,11 +4,13 @@ name: Release\n # Tag-triggered: build .deb, publish GitHub Release with the .deb attached\n # and human-readable notes, smoke-install on both platforms.\n #\n-# NOT (yet) included: SLSA L1 provenance attestation (deferred — see the\n-# comment near the end), Homebrew tap PR-open automation (deferred until\n-# a HOMEBREW_TAP_TOKEN secret is provisioned). The sha256 of the tag\n-# tarball is emitted in the Release body so the tap can be bumped by hand\n-# in the interim.\n+# SLSA L3 provenance attestation for the .deb is generated by the\n+# provenance job below via slsa-framework/slsa-github-generator's reusable\n+# generic workflow, then uploaded to the Release as .intoto.jsonl.\n+#\n+# NOT (yet) included: Homebrew tap PR-open automation (deferred until a\n+# HOMEBREW_TAP_TOKEN secret is provisioned). The sha256 of the tag tarball\n+# is emitted in the Release body so the tap can be bumped by hand.\n \n on:\n   push:\n@@ -26,6 +28,9 @@ jobs:\n       version: ${{ steps.meta.outputs.version }}\n       deb_name: ${{ steps.debmeta.outputs.deb_name }}\n       tarball_sha256: ${{ steps.meta.outputs.tarball_sha256 }}\n+      # Base64-encoded `sha256  filename` line for the .deb, consumed by\n+      # the SLSA provenance generator reusable workflow.\n+      subjects_b64: ${{ steps.provenance-subjects.outputs.subjects_b64 }}\n     steps:\n       - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2\n \n@@ -133,6 +138,21 @@ jobs:\n       - name: Build .deb via dpkg-buildpackage\n         run: dpkg-buildpackage -us -uc -b\n \n+      - name: Compute .deb sha256 subject for SLSA provenance\n+        id: provenance-subjects\n+        env:\n+          DEB_NAME: ${{ steps.debmeta.outputs.deb_name }}\n+        run: |\n+          set -euo pipefail\n+          # SLSA generic generator expects a base64-encoded shasum-style\n+          # line (\"SHA  FILENAME\"). Compute it against the .deb dpkg just\n+          # produced (in the parent dir, per dpkg-buildpackage convention).\n+          sha=$(sha256sum \"../${DEB_NAME}\" | awk '{print $1}')\n+          subject_line=\"${sha}  ${DEB_NAME}\"\n+          subjects_b64=$(printf '%s' \"$subject_line\" | base64 -w0)\n+          echo \"subjects_b64=$subjects_b64\" >> \"$GITHUB_OUTPUT\"\n+          echo \"SLSA subject: $subject_line\"\n+\n       - name: Stage .deb + release notes for upload\n         env:\n           DEB_NAME: ${{ steps.debmeta.outputs.deb_name }}\n@@ -230,7 +250,41 @@ jobs:\n             \"artifacts/${DEB_NAME}\"\n \n   # -------------------------------------------------------------------------\n-  # 3. Smoke-install the .deb from the freshly published Release.\n+  # 3. SLSA L3 provenance for the .deb.\n+  #\n+  # slsa-github-generator's generic reusable workflow produces an intoto\n+  # attestation binding this workflow run (repo, ref, workflow SHA, runner)\n+  # to the .deb's sha256, signs it with a Sigstore Fulcio short-lived cert\n+  # via the OIDC token, and attaches the .intoto.jsonl file to the Release.\n+  #\n+  # Level 3, not L1, because: hosted build (GitHub Actions), signed non-\n+  # falsifiable provenance (Sigstore), and isolated ephemeral runner —\n+  # the three L3 requirements per slsa.dev/spec/v1.0/levels.\n+  #\n+  # `needs: [build, publish]` — build supplies subjects_b64, publish must\n+  # have created the Release for `upload-assets: true` to attach the\n+  # attestation. permissions are the exact set the generator documents:\n+  # actions:read (attestation reads workflow_run metadata),\n+  # id-token:write (Sigstore OIDC), contents:write (upload to Release).\n+  #\n+  # No local `make` equivalent (.claude/rules/ci.md's \"every CI gate needs\n+  # a local make target\" does not apply here by construction): the\n+  # attestation requires GitHub's Sigstore OIDC token and an ephemeral\n+  # hosted runner identity, neither of which exists outside Actions.\n+  # -------------------------------------------------------------------------\n+  provenance:\n+    needs: [build, publish]\n+    permissions:\n+      actions: read\n+      id-token: write\n+      contents: write\n+    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0\n+    with:\n+      base64-subjects: ${{ needs.build.outputs.subjects_b64 }}\n+      upload-assets: true\n+\n+  # -------------------------------------------------------------------------\n+  # 4. Smoke-install the .deb from the freshly published Release.\n   # -------------------------------------------------------------------------\n   smoke-deb:\n     needs: [build, publish]\n@@ -290,7 +344,7 @@ jobs:\n           [ \"$rc\" -eq 124 ]\n \n   # -------------------------------------------------------------------------\n-  # 4. Smoke-install via Homebrew on BOTH shipping OSes.\n+  # 5. Smoke-install via Homebrew on BOTH shipping OSes.\n   # Uses the tag tarball URL + sha256 the build job computed (not --HEAD),\n   # so the smoke test exercises the exact commit this release ships — not\n   # whatever's on master when the workflow happens to run. Closes the\n@@ -398,11 +452,3 @@ jobs:\n           # 142 = 128 + SIGALRM(14), from the perl fallback path (macOS)\n           # Refusing 0 for the same reason as smoke-deb.\n           [ \"$rc\" -eq 124 ] || [ \"$rc\" -eq 142 ]\n-\n-  # -------------------------------------------------------------------------\n-  # SLSA L1 provenance attestation for the .deb is a follow-up under\n-  # xboing-qlw7: the reusable slsa-github-generator workflow needs base64\n-  # sha256 subjects wired from the build job, plus a signing-key ceremony\n-  # for L2. Not shipped in this PR so the core release path lands proven\n-  # green first. Header comment above corrected — this workflow does not\n-  # claim to include SLSA today.\n```\n\n`docs/CI.md`: no diff. `git diff master -- docs/CI.md` produced empty\noutput. It already asserts the SLSA job's SHA pin\n(`f7dd8c54c2067bafc12ca7a55595d5ee9b75204a`, line 138 — matches the\nrestored pin exactly) and the `provenance` job's `id-token: write`\npermission (line 143) — both statements are now true again with no\nedit needed.\n\n## Verification commands run (actual output)\n\n### 1. YAML parses\n\n```\n$ python3 -c \"import yaml,sys; yaml.safe_load(open('.github/workflows/release.yml')); print('YAML OK')\"\nYAML OK\n```\n\n### 2. markdownlint (make lint equivalent)\n\n`markdownlint-cli2` is not on `$PATH` in this worktree\n(`make lint` → `make: markdownlint-cli2: No such file or directory`,\nexit 127 — a tooling-availability gap, not a lint failure). Ran the\nsame linter via `npx` instead, across the full repo glob the Makefile\ntarget uses:\n\n```\n$ npx --yes markdownlint-cli2\nmarkdownlint-cli2 v0.23.2 (markdownlint v0.41.1)\nFinding: **/*.{md,markdown} !node_modules/** !build/** !build-*/** !.tmp/** !.beads/** !original/**\nLinting: 102 files\nSummary: 0 issues in 0 files\n```\n\n0 issues across all 102 markdown files, including `docs/CI.md`\n(unchanged, but reconfirmed clean).\n\n### 3. Full diff scoped correctly + protected-block check\n\n```\n$ git diff --stat master -- .github/workflows/release.yml docs/CI.md\n .github/workflows/release.yml | 76 ++++++++++++++++++++++++++++++++++---------\n 1 file changed, 61 insertions(+), 15 deletions(-)\n```\n\n(`docs/CI.md` shows 0 lines changed — omitted from stat because there's\nnothing to report.)\n\nGrepped the diff for any line touching the two protected blocks:\n\n```\n$ git diff master -- .github/workflows/release.yml | grep -E \"^[+-]\" | grep -v \"^+++\\|^---\" \\\n    | grep -iE \"linuxbrew|pipefail|UPSTREAM-REVISION|deb_name.*regex|install.sh\"\n+          set -euo pipefail\n```\n\nThe single match is `set -euo pipefail` inside the **new**\n`provenance-subjects` step I added (line ~141 of the new file) — not\nthe Linuxbrew block, which uses `set -o pipefail` (no `-eu`) and does\nnot appear in this diff at all, confirming it's untouched. The\n`deb_name`/`UPSTREAM-REVISION` guard also does not appear in the diff.\n\nI additionally re-read the full restored file end-to-end (`cat -n`)\nand visually confirmed:\n\n- The Linuxbrew bootstrap block (lines ~309-320 of the restored file:\n  `# SHA-pinned per punt-kit/standards/ci.md §9 ... set -o pipefail ...\n  curl -fsSL https://raw.githubusercontent.com/Homebrew/install/7a133dcc74051ee4efc79467ed215dfedf45aea2/install.sh | NONINTERACTIVE=1 /bin/bash`)\n  is byte-for-byte what's on master — zero diff lines touch it.\n- The `deb_name` derivation step (`Derive deb_name from architecture +\n  changelog revision`, strict `^[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+$` regex\n  guard) is byte-for-byte what's on master — zero diff lines touch it.\n\n## Explicit statement on the two protected blocks\n\n**Both protected blocks (Linuxbrew SHA-pin + `set -o pipefail` from\n#213, and the strict `deb_name` UPSTREAM-REVISION regex guard from\n#208) are byte-identical to master.** Confirmed by grep above (no diff\nlines matching them) and by direct visual re-read of the full restored\nfile.\n\n## Success-criteria checklist\n\n- [x] `subjects_b64` output wired to `steps.provenance-subjects.outputs.subjects_b64`\n- [x] `Compute .deb sha256 subject for SLSA provenance` step, id\n      `provenance-subjects`, placed between `Build .deb via\n      dpkg-buildpackage` and `Stage .deb + release notes for upload`\n- [x] `provenance` job: `needs: [build, publish]`, permissions\n      `actions:read` + `id-token:write` + `contents:write`, `uses:\n      slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a`,\n      `base64-subjects` from `needs.build.outputs.subjects_b64`,\n      `upload-assets: true`\n- [x] Header comment no longer claims SLSA is deferred — describes it\n      as shipped\n- [x] Trailing \"SLSA L1 ... follow-up under xboing-qlw7\" deferral\n      comment block deleted\n- [x] Section numbering renumbered: build=1, publish=2, provenance=3,\n      smoke-deb=4, smoke-brew=5\n- [x] Linuxbrew SHA-pin + `set -o pipefail` block byte-identical to\n      master\n- [x] `deb_name` UPSTREAM-REVISION regex guard byte-identical to\n      master\n- [x] `make lint` equivalent (npx markdownlint-cli2) passes; YAML\n      parses\n\nNot committed, not pushed, per instruction — leader reviews and\nhandles git.\n"
