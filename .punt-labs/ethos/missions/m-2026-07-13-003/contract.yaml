context: |
    PR #180 review (Copilot, src/game_modes.c:222). Stage 3's optional cleanup changed mode_game_enter's play-test-init branch from `prev == SDL2ST_EDIT` to `ctx->play_test_active` alone. The in-code comment claims they are "provably equivalent" — TRUE only for the initial EDIT->GAME entry, FALSE for re-entry: play_test_active stays true the whole play-test session, so any GAME -> (dialogue or pause) -> GAME re-entry would re-run this block and reinitialize lives_left=3, paddle HUGE, balls, ammo mid-play-test. The correct scoping for a ONE-TIME entry init is prev == SDL2ST_EDIT; play_test_active is the right tool only for the persistent per-tick guards (game_rules). This is a correctness/robustness fix + a misleading-comment fix. Part of fix/playtest-fidelity.
