name: Release

# Phase C of the CI + distribution plan (bead xboing-qlw7).
# Tag-triggered: build .deb, publish GitHub Release with the .deb attached
# and human-readable notes, smoke-install on both platforms.
#
# SLSA L3 provenance attestation for the .deb is generated by the
# provenance job below via slsa-framework/slsa-github-generator's reusable
# generic workflow, then uploaded to the Release as .intoto.jsonl.
#
# NOT (yet) included: Homebrew tap PR-open automation (deferred until a
# HOMEBREW_TAP_TOKEN secret is provisioned). The sha256 of the tag tarball
# is emitted in the Release body so the tap can be bumped by hand.

on:
  push:
    tags: ['v*']

permissions: read-all

jobs:
  # -------------------------------------------------------------------------
  # 1. Build the .deb and compute the sha256 that Homebrew needs.
  # -------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      deb_name: ${{ steps.debmeta.outputs.deb_name }}
      tarball_sha256: ${{ steps.meta.outputs.tarball_sha256 }}
      # Base64-encoded `sha256  filename` line for the .deb, consumed by
      # the SLSA provenance generator reusable workflow.
      subjects_b64: ${{ steps.provenance-subjects.outputs.subjects_b64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve and validate release metadata
        id: meta
        env:
          # GITHUB_REF_NAME is trusted (comes from the git ref itself), but
          # any downstream use has to treat it as untrusted string input —
          # tag names accept shell metachars. Everything below either
          # validates it or passes it via env: (never spliced into a run: body).
          REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Enforce STRICT semver — only digits and two dots after the v —
          # so downstream stanzas can safely echo the version into shell,
          # sed replacements, and heredoc contexts without command-injection
          # or URL-mangling risk. The bare shell glob `[0-9]*.[0-9]*.[0-9]*`
          # would let `v1.2.3-rc1` and `v1.2.3;id` through; grep is stricter.
          version="${REF_NAME#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag is not strict vMAJOR.MINOR.PATCH: $REF_NAME"
            exit 1
          fi

          # Fetch the GitHub-generated source tarball for the tag and hash it
          # so the tap update can pin url + sha256 without a manual round-trip.
          # --fail turns HTTP 4xx/5xx into a curl exit, so a 404 cannot be
          # hashed and quietly published in the Release notes.
          url="https://github.com/${GH_REPO}/archive/refs/tags/${REF_NAME}.tar.gz"
          echo "Fetching $url"
          curl --fail -sSL -o tarball.tgz "$url"
          sha=$(shasum -a 256 tarball.tgz | awk '{print $1}')
          rm -f tarball.tgz

          # deb_name comes from a separate step after the packaging toolchain
          # is installed — it needs `dpkg --print-architecture` and the
          # changelog Debian revision (from dpkg-parsechangelog), neither of
          # which is guaranteed on the runner before apt-get.
          {
            echo "version=$version"
            echo "tarball_sha256=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Install build + quality-gate toolchain
        run: |
          # devscripts pulls in dpkg-dev (dpkg-parsechangelog, dpkg-architecture)
          # which the next step needs; clang-format + cppcheck are what
          # `make format-check` and `make cppcheck-src` invoke. We skip
          # `make lint` (markdown) here because the release artifact does not
          # include markdown — docs.yml on PR CI is the gate for that.
          sudo apt-get update
          sudo apt-get install -y \
            build-essential devscripts debhelper cmake pkg-config lintian \
            clang-format cppcheck \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libcmocka-dev

      - name: Derive deb_name from architecture + changelog revision
        id: debmeta
        env:
          EXPECT_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # dpkg-parsechangelog Version field is "UPSTREAM-REVISION"
          # for Debian-non-native packages (e.g. "1.0.11-1", "1.0.11-2").
          # xboing IS Debian-non-native (single-source origin/, packaged in
          # debian/) so a Debian revision is REQUIRED — the regex below
          # rejects native-package versions (no `-`) explicitly rather than
          # falling into the ${raw%-*}/${raw##*-} both-yield-raw trap that
          # would silently emit `xboing_1.0.11-1.0.11_amd64.deb`. Arch comes
          # from the runner — ubuntu-latest is amd64 today but this workflow
          # would break on an ARM runner if left hardcoded.
          raw=$(dpkg-parsechangelog -l debian/changelog --show-field Version)
          if ! printf '%s' "$raw" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'; then
            echo "::error::debian/changelog Version ($raw) must be strict UPSTREAM-REVISION with digits only"
            exit 1
          fi
          upstream="${raw%-*}"
          revision="${raw##*-}"
          arch=$(dpkg --print-architecture)

          if [ "$upstream" != "$EXPECT_VERSION" ]; then
            echo "::error::debian/changelog upstream ($upstream) != tag ($EXPECT_VERSION)"
            exit 1
          fi

          deb_name="xboing_${upstream}-${revision}_${arch}.deb"
          echo "deb_name=$deb_name" >> "$GITHUB_OUTPUT"
          echo "Derived deb_name=$deb_name"

      - name: Run quality gates that apply to the release artifact
        run: |
          # NOT `make check`: the full local gate runs markdownlint-cli2
          # too, which needs Node/npm setup that adds no value for a
          # release build. PR CI already ran the markdown gate before this
          # commit reached master. Everything below matches what a Debian
          # package cares about.
          make format-check
          make cppcheck-src
          make test
          make asan-test

      - name: Build .deb via dpkg-buildpackage
        run: dpkg-buildpackage -us -uc -b

      - name: Compute .deb sha256 subject for SLSA provenance
        id: provenance-subjects
        env:
          DEB_NAME: ${{ steps.debmeta.outputs.deb_name }}
        run: |
          set -euo pipefail
          # SLSA generic generator expects a base64-encoded shasum-style
          # line ("SHA  FILENAME"). Compute it against the .deb dpkg just
          # produced (in the parent dir, per dpkg-buildpackage convention).
          sha=$(sha256sum "../${DEB_NAME}" | awk '{print $1}')
          subject_line="${sha}  ${DEB_NAME}"
          subjects_b64=$(printf '%s' "$subject_line" | base64 -w0)
          echo "subjects_b64=$subjects_b64" >> "$GITHUB_OUTPUT"
          echo "SLSA subject: $subject_line"

      - name: Stage .deb + release notes for upload
        env:
          DEB_NAME: ${{ steps.debmeta.outputs.deb_name }}
          TARBALL_SHA256: ${{ steps.meta.outputs.tarball_sha256 }}
          REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "../${DEB_NAME}" artifacts/
          # Extract the top-most changelog stanza as the Release body.
          awk '
            /^xboing \(/ { if (n++) exit; next }
            /^ -- / { if (n) exit }
            n
          ' debian/changelog > artifacts/release-notes.md

          # Append install snippets + tap-bump hint. Use a quoted heredoc so
          # backticks and $-prefixed shell tokens in the body do not get
          # expanded by bash. Known-safe values (validated above) are then
          # substituted in-place via sed after the file is written.
          cat >> artifacts/release-notes.md <<'EOF'

          ---

          ## Install

          Debian / Ubuntu:

          ```bash
          curl -L -o xboing.deb __REL_DEB_URL__
          sudo dpkg -i xboing.deb
          ```

          macOS / Linux (Homebrew tap):

          ```bash
          brew tap jmf-pobox/xboing
          brew install xboing
          ```

          ## Homebrew tap update (maintainer)

          Until the tap-PR-open step is wired, bump the tap by hand:

          - Formula `url`: `__REL_TARBALL_URL__`
          - Formula `sha256`: `__REL_TARBALL_SHA256__`
          EOF

          # Substitute known-safe values in-place. Values are validated
          # above (version is strict semver; SHA is 64 hex chars).
          rel_deb_url="https://github.com/${GH_REPO}/releases/download/${REF_NAME}/${DEB_NAME}"
          rel_tarball_url="https://github.com/${GH_REPO}/archive/refs/tags/${REF_NAME}.tar.gz"
          sed -i \
            -e "s|__REL_DEB_URL__|${rel_deb_url}|g" \
            -e "s|__REL_TARBALL_URL__|${rel_tarball_url}|g" \
            -e "s|__REL_TARBALL_SHA256__|${TARBALL_SHA256}|g" \
            artifacts/release-notes.md

      - name: Upload .deb + notes as workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------------------------
  # 2. Publish the GitHub Release with the .deb attached.
  # -------------------------------------------------------------------------
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: artifacts/

      - name: Create GitHub Release with .deb attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          DEB_NAME: ${{ needs.build.outputs.deb_name }}
        run: |
          set -euo pipefail
          gh release create "$REF_NAME" \
            --repo "$GH_REPO" \
            --title "xboing $VERSION" \
            --notes-file artifacts/release-notes.md \
            "artifacts/${DEB_NAME}"

  # -------------------------------------------------------------------------
  # 3. SLSA L3 provenance for the .deb.
  #
  # slsa-github-generator's generic reusable workflow produces an intoto
  # attestation binding this workflow run (repo, ref, workflow SHA, runner)
  # to the .deb's sha256, signs it with a Sigstore Fulcio short-lived cert
  # via the OIDC token, and attaches the .intoto.jsonl file to the Release.
  #
  # Level 3, not L1, because: hosted build (GitHub Actions), signed non-
  # falsifiable provenance (Sigstore), and isolated ephemeral runner —
  # the three L3 requirements per slsa.dev/spec/v1.0/levels.
  #
  # `needs: [build, publish]` — build supplies subjects_b64, publish must
  # have created the Release for `upload-assets: true` to attach the
  # attestation. permissions are the exact set the generator documents:
  # actions:read (attestation reads workflow_run metadata),
  # id-token:write (Sigstore OIDC), contents:write (upload to Release).
  #
  # No local `make` equivalent (.claude/rules/ci.md's "Every CI gate must
  # have a local `make` equivalent" does not apply here by construction): the
  # attestation requires GitHub's Sigstore OIDC token and an ephemeral
  # hosted runner identity, neither of which exists outside Actions.
  #
  # DELIBERATE §9 EXCEPTION — referenced by tag, NOT by commit SHA.
  # slsa-github-generator's README states, in bold, that its builders and
  # generators "MUST be referenced by tag in order for the slsa-verifier
  # to be able to verify the ref of the trusted builder/generator's
  # reusable workflow" — a SHA-pinned `uses:` here is silently rejected.
  # `.github/actions/generate-builder/builder-fetch.sh` in that repo
  # enforces it mechanically: it requires the resolved ref to start with
  # `refs/tags/` (exit 2 otherwise) and match `^v[0-9]+\.[0-9]+\.[0-9]+`
  # (exit 7 otherwise). A commit-SHA `uses:` line here builds and runs,
  # but produces NO .intoto.jsonl attestation — a silent loss of the
  # provenance this whole job exists to generate (see docs/CI.md §9/§10).
  #
  # Compensating control: this is not a bare downgrade from SHA-pinning.
  # builder-fetch.sh downloads the builder binary named by this tag and
  # verifies ITS SLSA provenance with slsa-verifier, cross-checking the
  # tag's resolved commit against the provenance material — so integrity
  # is enforced by the verifier, not by the ref being immutable. A tag is
  # still mutable in principle; do not treat this as equivalent to a SHA
  # pin, only as the generator's own documented substitute for one.
  # -------------------------------------------------------------------------
  provenance:
    needs: [build, publish]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.subjects_b64 }}
      upload-assets: true

  # -------------------------------------------------------------------------
  # 4. Smoke-install the .deb from the freshly published Release.
  # -------------------------------------------------------------------------
  smoke-deb:
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Install SDL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0

      - name: Download .deb from the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release download "$REF_NAME" \
            --repo "$GH_REPO" \
            --pattern '*.deb'

      - name: Install and verify
        env:
          EXPECT_VERSION: ${{ needs.build.outputs.version }}
          DEB_NAME: ${{ needs.build.outputs.deb_name }}
        run: |
          set -euo pipefail
          # Install the exact .deb the build job produced. Using the
          # deterministic name (not a glob) avoids matching debug-symbols
          # or a second arch if the release ever ships more than one asset.
          # apt-get install ./file.deb resolves runtime Depends automatically.
          sudo apt-get install -y "./$DEB_NAME"
          out=$(/usr/games/xboing -version)
          echo "$out"
          # xboing -version prints "xboing X.Y.Z" possibly followed by a
          # build/tag suffix — prefix-match on the tag-derived version.
          echo "$out" | grep -qE "^xboing ${EXPECT_VERSION}([[:space:]]|$)"

      - name: Headless smoke launch
        env:
          # Project convention: `dummy` is the standard headless driver for
          # smoke runs; `offscreen` is reserved for pixel-diff tests.
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set +e
          timeout --signal=TERM 3 /usr/games/xboing
          rc=$?
          set -e
          echo "xboing headless exit code: $rc"
          # GNU timeout without --preserve-status returns 124 whenever the
          # timeout hits (regardless of how the child was actually
          # signaled). Anything else — including 0 — means xboing exited
          # on its own before the timeout, which is a failure to prove
          # init works (game_create returns success on init failure, so
          # accepting 0 would hide a broken install).
          [ "$rc" -eq 124 ]

  # -------------------------------------------------------------------------
  # 5. Smoke-install via Homebrew on BOTH shipping OSes.
  # Uses the tag tarball URL + sha256 the build job computed (not --HEAD),
  # so the smoke test exercises the exact commit this release ships — not
  # whatever's on master when the workflow happens to run. Closes the
  # tag/master race documented in xboing-7vkl.
  # -------------------------------------------------------------------------
  smoke-brew:
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bootstrap Homebrew on Linux (pre-installed on macos-14)
        if: runner.os == 'Linux'
        run: |
          # SHA-pinned per punt-kit/standards/ci.md §9. Bump when Homebrew
          # updates the installer (check quarterly). Current: 2026-09-04.
          # Pipeline + pipefail (from the runner's default shell flags) makes
          # a curl failure fail the step immediately — with bash -c "$(curl…)"
          # a failed curl yields an empty script and bash -c "" exits 0.
          set -o pipefail
          curl -fsSL https://raw.githubusercontent.com/Homebrew/install/7a133dcc74051ee4efc79467ed215dfedf45aea2/install.sh \
            | NONINTERACTIVE=1 /bin/bash
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Install from a local tap pinned to the tag tarball
        env:
          TARBALL_SHA256: ${{ needs.build.outputs.tarball_sha256 }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Compose a formula pinned to THIS tag's tarball + sha256 (not
          # --HEAD), via the shared script (also used by the `bottle` job
          # below) so there is one implementation of the head->url rewrite.
          brew tap-new --no-git jmf-pobox/xboing-ci
          tap_path="$(brew --repository jmf-pobox/xboing-ci)"
          tarball_url="https://github.com/${GH_REPO}/archive/refs/tags/${REF_NAME}.tar.gz"
          packaging/homebrew/compose-formula.sh \
            packaging/homebrew/xboing.rb \
            "$tarball_url" \
            "$TARBALL_SHA256" \
            "$tap_path/Formula/xboing.rb"
          brew install jmf-pobox/xboing-ci/xboing

      - name: Verify installed binary reports the tag version
        env:
          EXPECT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          out=$(xboing -version)
          echo "$out"
          echo "$out" | grep -qE "^xboing ${EXPECT_VERSION}([[:space:]]|$)"

      - name: Headless smoke launch
        env:
          # `dummy` per project convention (see smoke-deb note above).
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set +e
          # Linux always has GNU `timeout` from coreutils. macos-14 ships
          # neither timeout nor gtimeout by default; fall back to perl
          # alarm → SIGALRM (signal 14) → shell exit 142.
          if command -v timeout >/dev/null 2>&1; then
            timeout --signal=TERM 3 xboing
          elif command -v gtimeout >/dev/null 2>&1; then
            gtimeout --signal=TERM 3 xboing
          else
            perl -e 'alarm 3; exec @ARGV' xboing
          fi
          rc=$?
          set -e
          echo "xboing headless exit code: $rc"
          # 124 = GNU timeout hit (Linux + Homebrew coreutils path)
          # 142 = 128 + SIGALRM(14), from the perl fallback path (macOS)
          # Refusing 0 for the same reason as smoke-deb.
          [ "$rc" -eq 124 ] || [ "$rc" -eq 142 ]

  # -------------------------------------------------------------------------
  # 6. Build and publish Homebrew bottles (prebuilt binaries) for the three
  # platforms the tap ships to. Bottling is the ONLY way `brew install
  # jmf-pobox/xboing/xboing` avoids a from-source build — without this job
  # the formula only ever has a `head`/`url`+`sha256` source stanza and brew
  # always compiles.
  #
  # bottling requires a genuinely tagged release (not workflow_dispatch on a
  # branch): the `build` job's strict-semver gate (~line 55) rejects any
  # REF_NAME that is not `vMAJOR.MINOR.PATCH`, and this job pins the formula
  # to that tag's source tarball via compose-formula.sh (the same script
  # smoke-brew above uses) before bottling it — there is no branch ref this
  # job could sensibly resolve to a tarball for. Exercising this path end to
  # end therefore requires pushing a real `v*` tag; see docs/RELEASING.md.
  #
  # Bottle tags produced: arm64_sonoma (macos-14 runner; Homebrew's bottle
  # tag names the OS codename, currently "sonoma" for that runner image),
  # x86_64_linux, arm64_linux (Homebrew renamed aarch64_linux ->
  # arm64_linux in Homebrew/brew#19188, official as of Homebrew 5.0). The
  # bottle-notes job below reads the real tag key out of each leg's
  # *.bottle.json rather than hardcoding it, so this comment is
  # documentation only, not something the workflow parses.
  # -------------------------------------------------------------------------
  bottle:
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # Force deterministic, un-colorized brew output. On hosted runners brew
      # emits ANSI color, which prefixes lines like "==> Pouring …" with an
      # escape sequence and defeats the anchored `^==> Pouring` grep below —
      # a CI-only failure the local `make bottle` (color auto-disabled when
      # piped) never reproduced. (First real-tag run, v1.0.12.)
      HOMEBREW_NO_COLOR: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Least privilege: this job's contents:write token is for the
          # asset upload only. Don't let checkout persist it in .git/config
          # where the Homebrew installer and `brew install` steps (which run
          # third-party formula/installer code) would inherit it. (Cursor
          # PR #230.) The upload step passes GH_TOKEN explicitly instead.
          persist-credentials: false

      - name: Bootstrap Homebrew on Linux (pre-installed on macos-14)
        if: runner.os == 'Linux'
        run: |
          # Same SHA-pinned installer as smoke-brew above (docs/CI.md §9).
          set -o pipefail
          curl -fsSL https://raw.githubusercontent.com/Homebrew/install/7a133dcc74051ee4efc79467ed215dfedf45aea2/install.sh \
            | NONINTERACTIVE=1 /bin/bash
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Compose a formula pinned to the tag tarball
        env:
          TARBALL_SHA256: ${{ needs.build.outputs.tarball_sha256 }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # One implementation of the head->url rewrite (packaging/homebrew/
          # compose-formula.sh), shared with smoke-brew above.
          brew tap-new --no-git jmf-pobox/xboing-ci
          # A freshly created tap's FIRST install is auto-trusted, but this
          # job installs from this tap TWICE (the from-source build below,
          # then the bottle pour further down) — the second install hits
          # Homebrew's tap-trust gate ("Refusing to load formula ... from
          # untrusted tap") without this. Verified locally (make bottle hit
          # the identical gate on its own tap's second install).
          brew trust --taps jmf-pobox/xboing-ci
          tap_path="$(brew --repository jmf-pobox/xboing-ci)"
          tarball_url="https://github.com/${GH_REPO}/archive/refs/tags/${REF_NAME}.tar.gz"
          packaging/homebrew/compose-formula.sh \
            packaging/homebrew/xboing.rb \
            "$tarball_url" \
            "$TARBALL_SHA256" \
            "$tap_path/Formula/xboing.rb"

      - name: Build the bottle from source (creates the keg `brew bottle` packages)
        run: |
          set -euo pipefail
          # `--build-bottle` forces FormulaInstaller#pour_bottle? to return
          # false unconditionally (formula_installer.rb: `return false if
          # ... build_bottle? ...`), so this step cannot pour even if a
          # bottle existed. Assert the resulting receipt agrees, using
          # Homebrew's own structured record of the fact
          # (Tab#poured_from_bottle, written at formula_installer.rb:1701)
          # rather than parsing free-text ohai/oh1 log lines — the generic
          # "==> Installing ..." header fires for both a pour and a source
          # build, so it cannot discriminate between them.
          brew install --build-bottle jmf-pobox/xboing-ci/xboing
          poured="$(brew info --json=v2 jmf-pobox/xboing-ci/xboing | jq -r '.formulae[0].installed[0].poured_from_bottle')"
          if [ "$poured" != "false" ]; then
            echo "::error::expected a from-source build here (--build-bottle disables pouring) but the install receipt says poured_from_bottle=$poured" >&2
            exit 1
          fi

      - name: Generate the bottle tarball + JSON from the just-built keg
        env:
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # --root-url points the embedded download URL at where `publish`
          # (job 2) already created the Release — the bottle-notes job
          # below (needs: bottle) uploads these same files there next.
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/${GH_REPO}/releases/download/${REF_NAME}" \
            jmf-pobox/xboing-ci/xboing
          # Bind the upload to EXACTLY these artifacts, captured now — before
          # the poured binary is exercised in the verify step — and record
          # their checksums. The upload step re-verifies the bytes and uploads
          # by name, so a misbehaving binary that dropped or overwrote a file
          # in the workspace cannot substitute the published asset (Cursor
          # PR #230). A single-tag `brew bottle` writes exactly one of each.
          shopt -s nullglob
          tarballs=( ./*.bottle.tar.gz )
          jsons=( ./*.bottle.json )
          if [ "${#tarballs[@]}" -ne 1 ] || [ "${#jsons[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .bottle.tar.gz and one .bottle.json" >&2
            printf '%s\n' ./*.bottle.* >&2
            exit 1
          fi
          bottle_tarball="${tarballs[0]}"
          bottle_json="${jsons[0]}"
          {
            echo "BOTTLE_TARBALL=$bottle_tarball"
            echo "BOTTLE_JSON=$bottle_json"
            echo "BOTTLE_TARBALL_SHA=$(shasum -a 256 "$bottle_tarball" | awk '{print $1}')"
            echo "BOTTLE_JSON_SHA=$(shasum -a 256 "$bottle_json" | awk '{print $1}')"
          } >> "$GITHUB_ENV"

      - name: Uninstall the source build + the build-only toolchain
        run: |
          set -euo pipefail
          # Remove the keg the source build produced above — the next step
          # pours the bottle tarball fresh, so this proves the pour (not
          # some leftover from the from-source install) is what's tested.
          brew uninstall jmf-pobox/xboing-ci/xboing
          # Remove the BUILD-ONLY deps (packaging/homebrew/xboing.rb's
          # `depends_on "cmake" => :build` / `"pkg-config" => :build`).
          # Deliberately does NOT remove sdl2/sdl2_image/sdl2_mixer/
          # sdl2_ttf — those are runtime depends_on lines, not build-only,
          # and xboing legitimately needs their shared libraries at
          # startup. If pouring + running still works with cmake and
          # pkg-config gone, that is the no-toolchain-needed proof: a
          # bottle install cannot be secretly falling back to a source
          # build, because the tools a source build would need are absent.
          # Best-effort removal of the build-only toolchain. This is a
          # SECONDARY signal, NOT the pour proof — the authoritative proof is
          # the `poured_from_bottle=true` receipt asserted in the pour step
          # below. Do NOT fail the release on it: formula names and installed
          # state vary across runners — current Homebrew ships the tool as
          # `pkgconf` (with `pkg-config` only an alias, so `Cellar/pkg-config`
          # does not exist), and `cmake` may not be a brew-installed formula
          # at all. The first real-tag run (v1.0.12) aborted here on exactly
          # that. So only uninstall names that are actually installed, and
          # tolerate failures. --ignore-dependencies: other preinstalled
          # formulae may depend on these on a hosted runner; force removal
          # regardless of unrelated dependents.
          for build_only in cmake pkg-config pkgconf; do
            if brew list --formula "$build_only" >/dev/null 2>&1; then
              brew uninstall --ignore-dependencies "$build_only" 2>/dev/null \
                || echo "note: could not remove $build_only (best-effort)"
            fi
          done

          # Informational only (NOT fatal): report any build-only tool still
          # present. The receipt + verify-bottle.sh below are what actually
          # prove the binary is a poured bottle, not a source build.
          for build_only in cmake pkg-config pkgconf; do
            if brew list --formula "$build_only" >/dev/null 2>&1; then
              echo "note: $build_only still present after best-effort removal"
            fi
          done

      - name: Pour the bottle directly from the local tarball
        run: |
          set -euo pipefail
          # Homebrew's Cellar keys kegs by BARE name, so an earlier keg for
          # `xboing` can survive and get silently reused instead of poured
          # fresh — force-remove the bare name before pouring. (Verified
          # against Homebrew 7.x in `make bottle`; same failure mode there.)
          brew uninstall --force xboing 2>/dev/null || true
          bottle_file="$(ls ./*.bottle.tar.gz)"
          echo "Pouring: $bottle_file"
          # HOMEBREW_DEVELOPER=1 is REQUIRED: Homebrew refuses to install a
          # formula from a bare/relative bottle-tarball path
          # (Formulary::FromBottleLoader short-circuits to nil) unless
          # HOMEBREW_DEVELOPER or HOMEBREW_TESTS is set. Without it this step
          # fails "No available formula with the name <tarball>" — verified
          # live in `make bottle`, which uses the identical pour. Set it
          # explicitly rather than relying on the runner's environment.
          HOMEBREW_DEVELOPER=1 brew install "$bottle_file" 2>&1 | tee pour.log
          # THE pour assertion (team-lead requirement #1): brew's own log
          # must say it poured a bottle, not that it built from source. A
          # test that can pass on a source-build fallback is not a bottle
          # test — this is what makes it one. Strip any ANSI escapes first so
          # the anchored match holds even if a runner forces color despite
          # HOMEBREW_NO_COLOR. Use process substitution, NOT `sed | grep -q`:
          # under `set -o pipefail`, `grep -q` closes the pipe on first match
          # and `sed` then dies of SIGPIPE writing later log lines, making the
          # pipeline non-zero even on a successful match — a false failure.
          # (Copilot PR #232.)
          if ! grep -qE '^==> Pouring .*\.bottle\.tar\.gz' \
               < <(sed $'s/\x1b\\[[0-9;]*m//g' pour.log); then
            echo "::error::expected '==> Pouring ...bottle.tar.gz' in brew's install log — got a source build (or unrecognized log wording) instead:" >&2
            cat pour.log >&2
            exit 1
          fi
          # Cross-check against Homebrew's own structured receipt rather
          # than trusting free-text log wording alone. `brew install
          # <local .bottle.tar.gz path>` (with HOMEBREW_DEVELOPER set) loads
          # via Formulary's FromBottleLoader and pours; assert it explicitly
          # so this fails loudly, not silently, if that ever stops holding.
          poured="$(brew info --json=v2 jmf-pobox/xboing-ci/xboing | jq -r '.formulae[0].installed[0].poured_from_bottle')"
          if [ "$poured" != "true" ]; then
            echo "::error::brew's install receipt says poured_from_bottle=$poured after installing a local bottle tarball — this should be impossible; investigate before trusting this bottle" >&2
            exit 1
          fi

      - name: Verify the poured binary (arch, version, headless launch)
        env:
          EXPECT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Informational only (NOT fatal, NOT the pour proof — see the pour
          # step's `poured_from_bottle=true` receipt for that): note whether
          # any build-only tool is present before the binary runs. Names vary
          # across runners (pkgconf vs pkg-config) and this inspects only
          # Homebrew's registry, not a system toolchain on PATH, so it can't
          # be conclusive and must never fail the release on its own.
          for build_only in cmake pkg-config pkgconf; do
            if brew list --formula "$build_only" >/dev/null 2>&1; then
              echo "note: $build_only present before the binary ran"
            fi
          done
          packaging/homebrew/verify-bottle.sh "$EXPECT_VERSION" xboing

      - name: Upload bottle tarball + JSON to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Re-verify the artifacts are byte-identical to what `brew bottle`
          # wrote (before the poured binary ran) and upload them BY NAME, not
          # a re-glob of the workspace — so nothing the binary may have
          # touched is published. (Cursor PR #230.)
          echo "${BOTTLE_TARBALL_SHA}  ${BOTTLE_TARBALL}" | shasum -a 256 -c -
          echo "${BOTTLE_JSON_SHA}  ${BOTTLE_JSON}" | shasum -a 256 -c -
          # --clobber: a re-run of this job (e.g. after a flaky leg) must be
          # able to overwrite its own prior upload rather than fail the step.
          gh release upload "$REF_NAME" \
            --repo "$GH_REPO" \
            --clobber \
            "$BOTTLE_TARBALL" "$BOTTLE_JSON"

  # -------------------------------------------------------------------------
  # 7. Assemble the tap's `bottle do` block from the three per-platform JSON
  # files the `bottle` job produced, and append it to the Release notes.
  #
  # This is Phase 2b (MANUAL tap-bump) per bead xboing-157: a human copies
  # the emitted block from the Release notes into Formula/xboing.rb in the
  # SEPARATE jmf-pobox/homebrew-xboing tap repo (NOT this repo's source-only
  # packaging/homebrew/xboing.rb) and pushes it there. This job deliberately
  # does NOT push to the tap itself and does NOT require a HOMEBREW_TAP_TOKEN
  # secret — see docs/RELEASING.md for the future automated (2a) path that
  # would need one.
  # -------------------------------------------------------------------------
  bottle-notes:
    needs: [build, publish, bottle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the per-platform bottle JSON files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p bottle-json
          gh release download "$REF_NAME" \
            --repo "$GH_REPO" \
            --pattern '*.bottle.json' \
            --dir bottle-json

      - name: Compose the bottle do block and append it to the Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          root_url="https://github.com/${GH_REPO}/releases/download/${REF_NAME}"

          {
            echo
            echo "## Homebrew bottle (tap maintainer action required)"
            echo
            echo "CI built prebuilt bottles for this release. Copy the block"
            echo "below into \`bottle do ... end\` in Formula/xboing.rb in the"
            echo "SEPARATE tap repo (jmf-pobox/homebrew-xboing) — NOT this"
            echo "repo's source-only packaging/homebrew/xboing.rb — replacing"
            echo "the placeholder shas, then commit + push. See docs/RELEASING.md."
            echo
            echo '```ruby'
            echo "  bottle do"
            echo "    root_url \"${root_url}\""
            # Each JSON is keyed by the tap-local formula full_name; read
            # cellar from the BOTTLE object and emit one
            # `sha256 cellar: <c>, tag: "..."` line per tag. Verified against
            # real `brew bottle --json`: cellar lives at `.<f>.bottle.cellar`
            # (a per-run value; e.g. "/opt/homebrew/Cellar"), NOT on each
            # `.tags.<tag>` entry (those carry sha256/filename/tab/… but no
            # cellar). The cellar MUST be preserved: omitting it makes
            # Homebrew assume the build-prefix cellar, so the bottle is
            # rejected (source-build fallback) for users on a different prefix
            # (Copilot + Cursor PR #230). Homebrew serializes a relocatable
            # cellar as a colon symbol string (":any", ":any_skip_relocation")
            # and a fixed one as an absolute path ("/opt/homebrew/Cellar"), so
            # emit the former unquoted and the latter quoted. Validate tag,
            # digest, AND cellar before emitting: the lines go into a Ruby
            # `bottle do` block a maintainer pastes into the tap, so a '"' or
            # '#{...}' in any field would become code when the formula loads —
            # fail loudly on anything unexpected.
            for f in bottle-json/*.bottle.json; do
              jq -r '.[] | .bottle as $b | ($b.cellar // "") as $cellar
                | $b.tags | to_entries[]
                | .key as $tag | .value.sha256 as $sha
                | ($tag | test("^(arm64_[a-z0-9]+|x86_64_linux|arm64_linux)$")) as $tag_ok
                | ($sha | test("^[a-f0-9]{64}$")) as $sha_ok
                | (if ($cellar | test("^:[a-z_]+$")) then "cellar: " + $cellar + ", "
                   elif ($cellar | test("^/[A-Za-z0-9/._-]+$")) then "cellar: \"" + $cellar + "\", "
                   else null end) as $cellar_str
                | if $tag_ok and $sha_ok and ($cellar_str != null)
                    then "    sha256 " + $cellar_str + $tag + ": \"" + $sha + "\""
                    else error("unsafe/missing bottle tag, sha256, or cellar: tag=" + $tag + " cellar=" + $cellar)
                  end' "$f"
            done
            echo "  end"
            echo '```'
          } > notes-appendix.md

          # Fetch the notes `publish` wrote, append the appendix, write back.
          # gh release edit takes the WHOLE body from --notes-file, so this
          # has to be read-modify-write, not a partial patch.
          gh release view "$REF_NAME" --repo "$GH_REPO" --json body -q .body > notes-current.md
          cat notes-current.md notes-appendix.md > notes-final.md
          gh release edit "$REF_NAME" --repo "$GH_REPO" --notes-file notes-final.md
