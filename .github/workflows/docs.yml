name: Docs

on:
  push:
    branches: [master]
    paths: ['**/*.md']
  pull_request:
    paths: ['**/*.md']

permissions: read-all

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19.1.0
