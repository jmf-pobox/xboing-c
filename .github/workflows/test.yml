name: Build & Test

on:
  push:
    branches: [master]
  pull_request:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            build_dir: build
          - preset: asan
            build_dir: build-asan

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config \
            libcmocka-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build ${{ matrix.build_dir }}

      - name: Test
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure

  # ---------------------------------------------------------------------------
  # Shipped-install verification (punt-kit/standards/ci.md §1–§3, §5).
  # These legs prove that the paths users actually run — the Debian .deb and
  # the Homebrew formula — install and launch. The build+test legs above
  # prove source-level correctness; these prove distribution.
  # ---------------------------------------------------------------------------

  install-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .deb build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential devscripts debhelper cmake pkg-config lintian \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libcmocka-dev

      - name: Build .deb via dpkg-buildpackage
        run: dpkg-buildpackage -us -uc -b

      - name: Install produced .deb
        run: sudo dpkg -i ../xboing_*_amd64.deb

      - name: Verify installed binary reports the release version
        run: |
          set -euo pipefail
          out=$(/usr/games/xboing -version)
          echo "$out"
          # Match the man page / formula convention: "xboing X.Y.Z"
          echo "$out" | grep -E '^xboing [0-9]+\.[0-9]+\.[0-9]+'

      - name: Verify installed binary passes headless smoke launch
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
          # Start the game headlessly and let it run briefly to prove SDL
          # init + asset resolution work end-to-end. Exit code 124 (timeout
          # killed a running process) is the success case.
          set +e
          timeout --signal=TERM 3 /usr/games/xboing
          rc=$?
          set -e
          echo "xboing headless exit code: $rc"
          # 124 = timeout ran happily; 0 = clean exit (also fine)
          [ "$rc" -eq 124 ] || [ "$rc" -eq 0 ]

  install-brew:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install from in-repo Homebrew formula (HEAD build)
        run: |
          # The formula in packaging/homebrew/ is the source of truth that
          # gets copied into the jmf-pobox/homebrew-xboing tap. Test it
          # directly so tap-copy regressions surface on the PR that makes
          # them, not after the tap update ships.
          brew install --HEAD --formula ./packaging/homebrew/xboing.rb

      - name: Verify installed binary reports the release version
        run: |
          set -euo pipefail
          out=$(xboing -version)
          echo "$out"
          # HEAD builds report the CMakeLists.txt project VERSION.
          echo "$out" | grep -E '^xboing [0-9]+\.[0-9]+\.[0-9]+'

      - name: Verify installed binary passes headless smoke launch
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
          set +e
          # macOS uses gtimeout via coreutils in some setups; ship the
          # bash timeout via `perl` fallback if timeout isn't present.
          if command -v timeout >/dev/null 2>&1; then
            timeout --signal=TERM 3 xboing
          elif command -v gtimeout >/dev/null 2>&1; then
            gtimeout --signal=TERM 3 xboing
          else
            perl -e 'alarm 3; exec @ARGV' xboing
          fi
          rc=$?
          set -e
          echo "xboing headless exit code: $rc"
          [ "$rc" -eq 124 ] || [ "$rc" -eq 0 ] || [ "$rc" -eq 143 ]
